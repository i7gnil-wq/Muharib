<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مُحارِب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #0a0a0a;
  --panel: #141414;
  --panel-border: #5c5240;
  --field: #0a0a0a;
  --field-border: #4a4235;
  --text: #d8c8a8;
  --muted: #9a8c72;
  --btn-blue: #cdb98f;
  --btn-gray: #e2d3b0;
  --btn-text: #0a0a0a;
  --accent: #e2d3b0;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 22px 22px,
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 22px 22px,
    radial-gradient(ellipse at top, #1a1a1a 0%, var(--bg) 70%);
  background-attachment: fixed;
  color: var(--text);
  font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
  direction: rtl;
  text-align: right;
  min-height: 100vh;
  padding-bottom: 14vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.box {
  width: 100%; max-width: 260px; padding: 10px 11px; margin: 8px auto; opacity: 1;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
}
h1 { font-size: .98rem; font-weight: 600; margin: 0 0 4px; color: var(--text); }
p { margin: 0 0 9px; line-height: 1.5; font-size: .76rem; }
label { display: block; font-size: .74rem; margin-bottom: 2px; color: var(--muted); }
input {
  width: 100%; padding: 3px 7px; margin-bottom: 6px; font-size: .78rem;
  background: var(--field); color: var(--text);
  border: 1px solid var(--field-border); border-radius: 4px;
  font: inherit; font-size: .78rem; direction: rtl; text-align: right;
}
input:focus { outline: 1px solid var(--btn-blue); }
button {
  background: var(--btn-blue); color: var(--btn-text);
  border: 1px solid #cdb98f; padding: 4px 12px; font: inherit; font-size: .78rem;
  cursor: pointer; border-radius: 4px;
}
button:hover { background: var(--btn-gray); }
button.full { width: 100%; }
.old { color: var(--accent); font-weight: 600; margin: 10px 0 0; }
.old a { color: var(--accent); text-decoration: underline; }
.err { color: var(--accent); font-size: .76rem; min-height: 1.2em; margin: 0 0 8px; }
.row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.row h1 { margin: 0; }
.code { font-size: 1.25rem; letter-spacing: 3px; direction: ltr; text-align: right; margin: 0; }
[hidden] { display: none !important; }

  </style>
</head>
<body>

  <!-- الواجهة الأولى: التسجيل -->
  <main class="box" id="view-signup">
    <div id="intro">
      <h1>أهلا بالمحارب الجديد!</h1>
      <p>"محارب" هي منصة للنصر في حرب الإدمان عن طريق تدريبات ومتابعات، هل انت مستعد لخوض خِضَم الحروب؟ هيا بنا!</p>
    </div>

    <form id="signup">
      <label for="name">اسم المحارب:</label>
      <input id="name" type="text" required autocomplete="off">
      <label for="why">لماذا تحارب؟</label>
      <input id="why" type="text" required autocomplete="off">
      <button type="submit" class="full">إلى الحرب!</button>
      <p class="old">محارب قديم؟ <a href="#" id="go-returning">عُد إلى صفوف الحرب!</a></p>
    </form>

    <div id="done" hidden>
      <div class="row"><h1>رمزك الحربي:</h1><span class="code" id="newcode"></span></div>
      <p>حطه على كتفك عشان ترجع متى ما تبغى!</p>
      <button type="button" id="go-empty">متابعة</button>
    </div>
  </main>

  <!-- واجهة المحارب القديم -->
  <main class="box" id="view-returning" hidden>
    <form id="returning">
      <label for="code">الرمز الحربي:</label>
      <input id="code" type="text" maxlength="3" required autocomplete="off">
      <p class="err" id="err"></p>
      <button type="submit" class="full">دخول</button>
    </form>
  </main>

  <!-- الواجهة الفارغة: لا يوجد داخلها شيء -->

  <script>
    // تخزين المحاربين في المتصفح: { الكود: بياناته }
    var KEY = "muharib_users";
    function allUsers() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
      catch (e) { return {}; }
    }
    function newCode(users) {
      var letters = "ABCDEFGHJKLMNPQRSTUVWXYZ", code;
      do {
        code = letters[Math.floor(Math.random() * letters.length)] +
               String(Math.floor(Math.random() * 100)).padStart(2, "0");
      } while (users[code]);
      return code;
    }

    var signupView = document.getElementById("view-signup");
    var returningView = document.getElementById("view-returning");

    function showEmpty() {
      signupView.hidden = true;
      returningView.hidden = true;
    }

    document.getElementById("go-returning").addEventListener("click", function (e) {
      e.preventDefault();
      signupView.hidden = true;
      returningView.hidden = false;
    });

    document.getElementById("signup").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("name").value.trim();
      var why = document.getElementById("why").value.trim();
      if (!name || !why) return;
      var users = allUsers();
      var code = newCode(users);
      users[code] = { name: name, why: why };
      localStorage.setItem(KEY, JSON.stringify(users));
      document.getElementById("newcode").textContent = code;
      document.getElementById("signup").hidden = true;
      document.getElementById("intro").hidden = true;
      document.getElementById("done").hidden = false;
    });

    document.getElementById("go-empty").addEventListener("click", showEmpty);

    document.getElementById("returning").addEventListener("submit", function (e) {
      e.preventDefault();
      var code = document.getElementById("code").value.trim().toUpperCase();
      if (allUsers()[code]) {
        showEmpty();
      } else {
        document.getElementById("err").textContent = "الكود غير صحيح";
      }
    });
  </script>
</body>
</html>
